<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Meeting Translator</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202b28;
      --muted: #64716c;
      --paper: #fbfaf5;
      --card: #fff;
      --green: #23634e;
      --green-dark: #194b3b;
      --line: #dedfd5;
      --highlight: #f1f4e9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.5;
    }
    .page { width: min(100% - 32px, 720px); margin: 0 auto; padding: 34px 0 28px; }
    .topline { display: flex; align-items: center; gap: 9px; color: var(--green); font-size: .77rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .topline span { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #df815f; }
    h1 { margin: 11px 0 5px; font-size: clamp(2rem, 8vw, 3.1rem); line-height: 1.06; letter-spacing: -.055em; }
    .tagline { margin: 0; max-width: 490px; color: var(--muted); font-size: 1.04rem; }
    .translator {
      margin-top: 25px;
      padding: clamp(18px, 5vw, 30px);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 10px 28px rgba(32, 43, 40, .055);
    }
    .label { display: block; margin-bottom: 9px; font-weight: 750; }
    .input-row { display: flex; gap: 9px; }
    input[type='text'] {
      flex: 1; min-width: 0; height: 48px; padding: 0 13px;
      border: 1px solid #cdd2c8; border-radius: 10px; background: #fff;
      color: var(--ink); font: inherit; font-size: 1rem;
    }
    input::placeholder { color: #87918a; }
    button { font: inherit; cursor: pointer; }
    .translate {
      min-height: 48px; padding: 0 17px; border: 0; border-radius: 10px;
      background: var(--green); color: #fff; font-weight: 750;
      transition: background .15s ease, transform .15s ease;
    }
    .translate:hover { background: var(--green-dark); }
    .translate:active { transform: translateY(1px); }
    button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid #e59464; outline-offset: 3px; }
    .samples { margin-top: 22px; }
    .samples-label { margin: 0 0 10px; color: var(--muted); font-size: .88rem; font-weight: 700; }
    .sample-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .sample {
      min-height: 43px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px;
      background: #fff; color: var(--ink); text-align: left; font-size: .91rem; font-weight: 650;
      transition: border-color .15s ease, background .15s ease;
    }
    .sample:hover { border-color: #8ba696; background: var(--highlight); }
    .result {
      margin-top: 20px; padding: 18px; border: 1px solid #d7dfd0; border-radius: 12px;
      background: var(--highlight);
    }
    .result[hidden] { display: none; }
    .result-label { margin: 0 0 5px; color: var(--green); font-size: .72rem; font-weight: 850; letter-spacing: .1em; text-transform: uppercase; }
    .original { margin: 0 0 7px; color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
    .translation { margin: 0; font-size: clamp(1.15rem, 4vw, 1.45rem); font-weight: 750; line-height: 1.3; overflow-wrap: anywhere; }
    .clear-row { display: flex; justify-content: flex-end; margin-top: 12px; }
    .clear { padding: 5px 8px; border: 0; background: transparent; color: var(--muted); font-size: .86rem; text-decoration: underline; text-underline-offset: 3px; }
    .clear:hover { color: var(--ink); }
    .hint { margin: 13px 0 0; color: var(--muted); font-size: .83rem; }
    footer { margin-top: 20px; color: var(--muted); font-size: .84rem; }
    footer a { color: var(--green); font-weight: 700; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    @media (max-width: 430px) {
      .page { width: min(100% - 24px, 720px); padding-top: 25px; }
      .input-row { flex-direction: column; }
      .translate { width: 100%; }
      .sample-list { grid-template-columns: 1fr; }
      .translator { margin-top: 20px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class='page'>
    <header>
      <div class='topline'><span aria-hidden='true'></span> The meeting-room decoder</div>
      <h1>Meeting Translator</h1>
      <p class='tagline'>Corporate phrases, translated into what everyone means.</p>
    </header>

    <main class='translator'>
      <form id='phrase-form'>
        <label class='label' for='phrase'>What did they say?</label>
        <div class='input-row'>
          <input id='phrase' name='phrase' type='text' maxlength='140' placeholder='Type a bit of meeting-speak…' autocomplete='off'>
          <button class='translate' type='submit'>Translate</button>
        </div>
      </form>

      <section class='samples' aria-labelledby='samples-heading'>
        <p class='samples-label' id='samples-heading'>Or pick a phrase to translate:</p>
        <div class='sample-list'>
          <button class='sample' type='button' data-phrase='Quick sync'>Quick sync</button>
          <button class='sample' type='button' data-phrase='Let’s take this offline'>Let’s take this offline</button>
          <button class='sample' type='button' data-phrase='Circle back'>Circle back</button>
          <button class='sample' type='button' data-phrase='Let’s align'>Let’s align</button>
          <button class='sample' type='button' data-phrase='I’ll keep you in the loop'>I’ll keep you in the loop</button>
          <button class='sample' type='button' data-phrase='Can you share a few thoughts?'>Can you share a few thoughts?</button>
        </div>
      </section>

      <section class='result' id='result' aria-live='polite' aria-atomic='true' hidden>
        <p class='result-label'>Plain-English translation</p>
        <p class='original' id='original'></p>
        <p class='translation' id='translation'></p>
      </section>
      <div class='clear-row'><button class='clear' id='clear' type='button'>Clear and start over</button></div>
      <p class='hint'>No jargon is safe. Type your own phrase or tap another one anytime.</p>
    </main>

    <footer><a href='https://ka-chowf1.github.io/Dumb-Little-Internet/'>← Back to Dumb Little Internet</a></footer>
  </div>

  <script>
    (function () {
      const input = document.getElementById('phrase');
      const result = document.getElementById('result');
      const original = document.getElementById('original');
      const translation = document.getElementById('translation');
      const phrases = {
        'quick sync': 'This will take 30 minutes and somehow require a follow-up.',
        'lets take this offline': 'We will continue this exact conversation in a smaller room.',
        'circle back': 'No one has decided; please remember this for us.',
        'lets align': 'We disagree, but let’s schedule a meeting before admitting it.',
        'ill keep you in the loop': 'You may receive an email about this after it is already over.',
        'can you share a few thoughts': 'Please do some work, but make it sound like a casual favor.',
        'just flagging': 'I am worried, but I would like to seem relaxed about it.',
        'take this offline': 'We will continue this exact conversation in a smaller room.',
        'low hanging fruit': 'Let’s do the easiest thing and call it a strategy.',
        'at capacity': 'My calendar has become a cry for help.'
      };

      function translate(text) {
        const phrase = text.trim();
        if (!phrase) {
          input.focus();
          return;
        }
        const key = phrase.toLowerCase().replace(/[.!?]+$/g, '').replace(/[’']/g, '');
        const meaning = phrases[key] || 'We have not agreed on what this means yet, but the meeting invite is already sent.';
        original.textContent = 'You said: ' + phrase;
        translation.textContent = meaning;
        result.hidden = false;
      }

      document.getElementById('phrase-form').addEventListener('submit', function (event) {
        event.preventDefault();
        translate(input.value);
      });
      document.querySelectorAll('[data-phrase]').forEach(function (button) {
        button.addEventListener('click', function () {
          input.value = button.getAttribute('data-phrase');
          translate(input.value);
        });
      });
      document.getElementById('clear').addEventListener('click', function () {
        input.value = '';
        original.textContent = '';
        translation.textContent = '';
        result.hidden = true;
        input.focus();
      });
    }());
  </script>
</body>
</html>
